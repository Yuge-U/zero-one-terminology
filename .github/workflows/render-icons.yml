name: Render ZERO ONE icons
on:
  workflow_dispatch:
  push:
    paths:
      - icon.svg
      - scripts/render-icons.cjs
      - package.json
      - package-lock.json
      - .github/workflows/render-icons.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify committed icons match vector source
        run: git diff --exit-code -- icon-180-v2.png icon-192-v2.png icon-512-v2.png
