name: Temporary normalize terminology release
on:
  push:
    branches:
      - feature/expand-youth-coaching-terms-20261017
permissions:
  contents: write
concurrency:
  group: terminology-release-normalize-20261017
  cancel-in-progress: false
jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Recreate cross-platform release artifacts
        run: node scripts/build-update-release.mjs
      - name: Validate local build integrity
        run: |
          node scripts/build-update-release.mjs --check
          node --test tests/terminology-expansion.test.cjs tests/speech.test.cjs tests/learning.test.cjs tests/diagrams.test.cjs
      - name: Commit normalized release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app-version.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Normalize release build metadata for Linux and macOS CI"
            git push origin HEAD:feature/expand-youth-coaching-terms-20261017
          fi
