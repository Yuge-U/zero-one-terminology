<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111c"><title>ZERO ONE TERMINOLOGY</title><link rel="icon" href="icon.svg"><style>
:root{--dark:#09111c;--dark2:#101c2b;--blue:#1688ff;--blue2:#eaf4ff;--paper:#f6f8fb;--line:#dce4ed;--muted:#718096;--green:#13a66b}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--paper);color:#152033}.top{background:linear-gradient(125deg,#070d14,#101b29);color:white;padding:18px 20px;border-bottom:1px solid #263548}.hero{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px}.brand img{width:48px}.brand b{letter-spacing:.18em}.brand small{display:block;color:#9fb1c5;margin-top:4px;letter-spacing:.06em}.tagline b{font-size:20px}.tagline small{display:block;color:#93a7bd;margin-top:4px}.count{font-size:32px;font-weight:800}.count small{font-size:11px;color:#9fb1c5}.categorybar{background:#0d1724;border-top:1px solid #1d2b3d}.cats{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(6,1fr)}.cat{padding:14px 6px;color:#b9c7d7;text-align:center;border-right:1px solid #1d2b3d;cursor:pointer;font-size:12px}.cat b{display:block;font-size:21px;color:white;margin-bottom:4px}.cat.on{background:#14273d;color:#62adff;box-shadow:inset 0 -3px var(--blue)}.app{max-width:1180px;margin:auto;display:grid;grid-template-columns:390px 1fr;min-height:70vh}.left{background:#fff;border-right:1px solid var(--line)}.search{padding:16px;border-bottom:1px solid var(--line);background:#fff}.search input{width:100%;padding:14px;border:1px solid #cdd7e2;border-radius:12px;font-size:16px}.quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{border:1px solid #d4dde7;background:white;padding:7px 10px;border-radius:999px;font-size:12px;color:#405168}.pill.on{background:var(--blue);border-color:var(--blue);color:white}.listhead{padding:12px 16px;color:var(--muted);font-size:13px}.terms{max-height:68vh;overflow:auto}.term{padding:14px 16px;border-top:1px solid #edf1f5;display:grid;grid-template-columns:1fr auto;gap:10px;cursor:pointer}.term.active,.term:hover{background:var(--blue2);box-shadow:inset 4px 0 var(--blue)}.term b{display:block}.term small{color:#718096}.tag{font-size:10px;background:#edf2f7;padding:4px 6px;border-radius:6px}.detail{padding:26px}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 30px #14243a0b}.back{display:none}.fav{float:right;border:0;background:transparent;font-size:26px;color:#a5b1bf}.fav.on{color:#ffb000}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.08em}.title{font-size:clamp(28px,4vw,42px);margin:6px 0 2px}.jp{font-size:18px;font-weight:700}.listen{margin:14px 0;border:1px solid #acd3ff;background:#eef7ff;color:#0676e8;padding:9px 13px;border-radius:10px;font-weight:700}.section{border-top:1px solid #e8edf3;margin-top:20px;padding-top:18px}.section h3{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:#627287}.definition{line-height:1.8;font-size:16px}.canvas{background:linear-gradient(180deg,#0b1624,#101f31);border:1px solid #203a57;border-radius:15px;padding:18px;color:#e8f3ff;position:relative;overflow:hidden}.court{height:130px;border:2px solid #54708d;border-bottom:0;border-radius:70px 70px 0 0;opacity:.55;position:relative}.court:before{content:"";position:absolute;width:64px;height:50px;border:2px solid #54708d;border-top:0;left:50%;transform:translateX(-50%)}.court:after{content:"01";position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);font-weight:900;font-size:34px;color:#1688ff;opacity:.55}.actiontxt{margin-top:12px;font-family:ui-monospace,monospace;color:#b9d9ff}.language{display:grid;grid-template-columns:1fr 1fr;gap:10px}.langbox{background:#f7f9fc;border:1px solid #e1e7ee;border-radius:12px;padding:13px}.langbox small{display:block;color:#748399;margin-bottom:5px}.source a{color:#0876e8;word-break:break-all}.empty{display:grid;place-items:center;min-height:55vh;text-align:center;color:#8291a4}.empty img{width:76px}.hint{font-size:13px;color:#748399}.badge{display:inline-block;font-size:11px;padding:5px 8px;border-radius:7px;background:#edf2f7;margin:10px 4px 0 0}.badge.green{background:#e5f8ef;color:#087a4a}.badge.blue{background:#e6f2ff;color:#0876e8}@media(max-width:780px){.tagline{display:none}.brand b{font-size:15px}.brand small{font-size:12px}.count{font-size:25px}.cats{grid-template-columns:repeat(6,1fr)}.cat{font-size:9px;padding:10px 2px}.cat b{font-size:18px}.app{display:block}.terms{max-height:none}.detail{display:none;padding:12px}.app.show .left{display:none}.app.show .detail{display:block}.back{display:inline-block;border:0;background:#eaf4ff;color:#0876e8;padding:9px 12px;border-radius:9px;margin-bottom:10px}.card{padding:20px}.language{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="hero"><div class="brand"><img src="icon.svg"><div><b>ZERO ONE<br>TERMINOLOGY</b><small>Basketball Global Language</small></div></div><div class="tagline"><b>SEE THE GAME. SHARE THE LANGUAGE.</b><small>見る・理解する・伝える。世界のバスケットボールを共通言語で。</small></div><div class="count"><span id="total">514</span> <small>TERMS</small></div></div></header>
<nav class="categorybar"><div class="cats"><div class="cat on" data-cat="ALL"><b>◎</b>ALL</div><div class="cat" data-cat="OFFENSE"><b>↗</b>OFFENSE</div><div class="cat" data-cat="DEFENSE"><b>◇</b>DEFENSE</div><div class="cat" data-cat="SKILL"><b>◉</b>SKILL</div><div class="cat" data-cat="COURT"><b>▦</b>COURT</div><div class="cat" data-cat="RULE"><b>≡</b>RULE</div></div></nav>
<main class="app" id="app"><section class="left"><div class="search"><input id="q" placeholder="英語・日本語・別称から検索"><div class="quick"><button class="pill on" data-q="ALL">すべて</button><button class="pill" data-q="FAV">★ お気に入り</button></div><div class="hint" style="margin-top:9px">例：Spain / スペイン / Pick and Roll / スイッチ</div></div><div class="listhead" id="hits"></div><div class="terms" id="terms"></div></section><section class="detail" id="detail"><div class="empty"><div><img src="icon.svg"><h2>SEE THE GAME.</h2><p>用語を選ぶと「意味・動き・言葉」を一緒に学べます。</p></div></div></section></main>
<script>
let DATA=[],cat='ALL',quick='ALL',selected=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),favs=()=>new Set(JSON.parse(localStorage.getItem('zot_favs')||'[]'));
function group(t){let c=String(t['カテゴリー']||''),s=String(t['OF/DF']||'');if(c.includes('ルール'))return'RULE';if(c.includes('コート')||c.includes('位置'))return'COURT';if(c.includes('ドリブル')||c.includes('パス')||c.includes('シュート')||c.includes('フィニッシュ')||c.includes('フットワーク'))return'SKILL';if(s==='DF'||c.includes('DF'))return'DEFENSE';if(s==='OF')return'OFFENSE';return'OFFENSE'}
function match(t){let q=$('#q').value.trim().toLowerCase(),blob=[t['正式/標準用語'],t['日本語推奨表記'],t['別称'],t['略語'],t['定義']].join(' ').toLowerCase();if(q&&!blob.includes(q))return false;if(cat!=='ALL'&&group(t)!==cat)return false;if(quick==='FAV'&&!favs().has(t.ID))return false;return true}
function render(){let a=DATA.filter(match);$('#hits').textContent=a.length+'件';$('#terms').innerHTML=a.map(t=>'<div class="term '+(selected===t.ID?'active':'')+'" data-id="'+esc(t.ID)+'"><div><b>'+esc(t['正式/標準用語'])+'</b><small>'+esc(t['日本語推奨表記']||'')+'</small></div><span class="tag">'+esc(group(t))+'</span></div>').join('');document.querySelectorAll('.term').forEach(e=>e.onclick=()=>show(e.dataset.id))}
function speak(text){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function toggleFav(id){let f=favs();f.has(id)?f.delete(id):f.add(id);localStorage.setItem('zot_favs',JSON.stringify([...f]));show(id);render()}
function confidence(t){let s=String(t['標準度']||'');return s==='A'?'GLOBAL｜世界で意味が安定':s==='B'?'COMMON｜広く使われる・別称あり':'CONTEXT｜チームや地域で意味差あり'}
function show(id){let t=DATA.find(x=>x.ID===id);if(!t)return;selected=id;let f=favs().has(id),term=t['正式/標準用語'],alias=t['別称']||'—',fiba=String(t['FIBA掲載有無']||'');$('#detail').innerHTML='<button class="back" onclick="back()">← 用語一覧</button><div class="card"><button class="fav '+(f?'on':'')+'" onclick="toggleFav(\''+esc(id)+'\')">★</button><div class="eyebrow">'+esc(group(t))+' · '+esc(t.ID)+'</div><h1 class="title">'+esc(term)+'</h1><div class="jp">'+esc(t['日本語推奨表記']||'')+'</div><button class="listen" onclick="speak(\''+esc(term).replace(/'/g,"\\'")+'\')">▶ 英語の発音を聞く</button><div><span class="badge blue">'+esc(confidence(t))+'</span>'+(fiba.startsWith('○')?'<span class="badge green">FIBA掲載</span>':'')+'</div><div class="section"><h3>WHAT｜何が起きる？</h3><div class="definition">'+esc(t['定義']||'')+'</div></div><div class="section"><h3>SEE｜動きで見る</h3><div class="canvas"><div class="court"></div><div class="actiontxt">'+esc(t['Action図']||'動きの図解は順次追加します')+'</div></div></div><div class="section"><h3>LANGUAGE｜英語から入る</h3><div class="language"><div class="langbox"><small>ENGLISH</small><b>'+esc(term)+'</b></div><div class="langbox"><small>JAPANESE</small><b>'+esc(t['日本語推奨表記']||'')+'</b></div><div class="langbox"><small>ALSO CALLED｜別称</small>'+esc(alias)+'</div><div class="langbox"><small>ABBREVIATION｜略語</small>'+esc(t['略語']||'—')+'</div></div><p class="hint">まず「英語を聞く → 日本語で意味を確認 → コート上の現象と結びつける」。語学ではなく、バスケを入口に英語へ触れる設計です。</p></div><div class="section"><h3>USE｜どこで使われる？</h3><div>'+esc(t['NBA/欧州での使用例']||'国際的なバスケットボール現場で使用')+'</div><p class="hint">'+esc(confidence(t))+'</p></div>'+(t['主要出典URL']?'<div class="section source"><h3>SOURCE｜根拠</h3><a href="'+esc(t['主要出典URL'])+'" target="_blank">出典を確認する ↗</a></div>':'')+'</div>';$('#app').classList.add('show');render();window.scrollTo(0,0)}
function back(){$('#app').classList.remove('show')}
$('#q').oninput=render;document.querySelectorAll('.cat').forEach(e=>e.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));e.classList.add('on');cat=e.dataset.cat;render()});document.querySelectorAll('.pill').forEach(e=>e.onclick=()=>{document.querySelectorAll('.pill').forEach(x=>x.classList.remove('on'));e.classList.add('on');quick=e.dataset.q;render()});fetch('terms.json').then(r=>r.json()).then(d=>{DATA=d;$('#total').textContent=d.length;render()});
</script></body></html>
