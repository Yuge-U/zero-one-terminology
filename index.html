<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1017"><title>ZERO ONE TERMINOLOGY</title><link rel="icon" href="icon.svg"><style>
:root{--ink:#0b1017;--panel:#111923;--line:#dce3eb;--muted:#718096;--blue:#1688ff;--blue2:#eaf4ff;--paper:#f7f9fc;--green:#16a66a}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--paper);color:#172033}.top{background:linear-gradient(115deg,#080c12,#101923);color:#fff;padding:18px 22px;position:sticky;top:0;z-index:5;border-bottom:1px solid #273241}.brand{display:flex;align-items:center;gap:12px}.brand img{width:44px;height:44px}.brand b{letter-spacing:.16em;font-size:16px}.brand small{display:block;color:#9fb0c3;letter-spacing:.08em;margin-top:2px}.hero{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}.hero h1{font-size:clamp(21px,4vw,34px);margin:0}.hero p{color:#aebdce;margin:5px 0 0}.count{font-size:32px;font-weight:800;white-space:nowrap}.count span{font-size:12px;color:#aebdce}.app{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:390px 1fr;min-height:calc(100vh - 86px)}.left{border-right:1px solid var(--line);background:#fff}.search{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:81px;background:#fff;z-index:4}.search input{width:100%;padding:14px 15px;border:1px solid #cfd8e3;border-radius:12px;font-size:16px;outline:none}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.chip{border:1px solid #d5dee8;background:#fff;padding:7px 10px;border-radius:999px;font-size:12px;cursor:pointer}.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}.listhead{padding:12px 16px;color:var(--muted);font-size:13px}.terms{max-height:calc(100vh - 240px);overflow:auto}.term{padding:13px 16px;border-top:1px solid #edf1f5;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:10px}.term:hover,.term.active{background:var(--blue2);box-shadow:inset 3px 0 var(--blue)}.term b{display:block;font-size:15px}.term small{color:#68778a}.badges{display:flex;gap:4px}.badge{font-size:10px;padding:4px 6px;border-radius:6px;background:#edf2f7;color:#425466}.badge.blue{background:#e6f2ff;color:#0876e8}.badge.green{background:#e5f8ef;color:#087a4a}.detail{padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 10px 30px #1322380a}.eyebrow{color:var(--blue);font-size:12px;font-weight:700}.title{font-size:clamp(27px,4vw,42px);margin:5px 0 3px}.jp{font-size:18px;font-weight:700;margin-bottom:14px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:25px}.section{border-top:1px solid #e9eef4;padding-top:20px;margin-top:20px}.section h3{font-size:13px;margin:0 0 9px;color:#536273}.definition{font-size:17px;line-height:1.8}.action{font-family:monospace;background:#0d1520;color:#dbeaff;padding:16px;border-radius:12px}.source a{color:var(--blue);word-break:break-all}.empty{display:grid;place-items:center;min-height:60vh;color:#8290a3;text-align:center}.empty img{width:78px;margin-bottom:14px}.mobile-back{display:none}.fav{float:right;border:0;background:transparent;font-size:26px;color:#9aa8b7}.fav.on{color:#ffb000}@media(max-width:780px){.hero .tagline{display:none}.count{font-size:24px}.app{display:block}.left{border-right:0}.terms{max-height:none}.detail{display:none;padding:14px}.app.show-detail .left{display:none}.app.show-detail .detail{display:block}.search{top:80px}.mobile-back{display:inline-block;border:0;background:#eaf4ff;color:#0876e8;padding:9px 12px;border-radius:9px;margin-bottom:12px}.card{padding:20px}.title{font-size:30px}}</style></head><body><header class="top"><div class="hero"><div class="brand"><img src="icon.svg"><div><b>ZERO ONE TERMINOLOGY</b><small>Basketball Global Language</small></div></div><div class="tagline"><h1>言葉を揃える。判断がつながる。</h1><p>FIBA基準＋世界の現場基準を、ひとつの辞書に。</p></div><div class="count"><i id="total">514</i> <span>TERMS</span></div></div></header><main class="app" id="app"><section class="left"><div class="search"><input id="q" placeholder="用語を検索｜Spain / スペイン / ICE ..."><div class="chips"><button class="chip on" data-f="ALL">すべて</button><button class="chip" data-f="OF">OF</button><button class="chip" data-f="DF">DF</button><button class="chip" data-f="FIBA">FIBA</button><button class="chip" data-f="WORLD">世界差分</button><button class="chip" data-f="A">標準度A</button><button class="chip" data-f="FAV">★ お気に入り</button></div></div><div class="listhead"><span id="hits"></span></div><div class="terms" id="terms"></div></section><section class="detail" id="detail"><div class="empty"><div><img src="icon.svg"><h2>ZERO ONE TERMINOLOGY</h2><p>左から用語を選択してください。</p></div></div></section></main><script>
let DATA=[],filter='ALL',selected=null;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const favs=()=>new Set(JSON.parse(localStorage.getItem('zot_favs')||'[]'));function match(t){const q=$('#q').value.trim().toLowerCase();const blob=[t['正式/標準用語'],t['日本語推奨表記'],t['別称'],t['略語'],t['定義'],t['カテゴリー']].join(' ').toLowerCase();if(q&&!blob.includes(q))return false;if(filter==='OF'&&t['OF/DF']!=='OF')return false;if(filter==='DF'&&t['OF/DF']!=='DF')return false;if(filter==='FIBA'&&!String(t['FIBA掲載有無']).startsWith('○'))return false;if(filter==='WORLD'&&!String(t['FIBA掲載有無']).includes('独立項目なし'))return false;if(filter==='A'&&t['標準度']!=='A')return false;if(filter==='FAV'&&!favs().has(t.ID))return false;return true}function renderList(){const a=DATA.filter(match);$('#hits').textContent=a.length+'件の用語';$('#terms').innerHTML=a.map(t=>'<div class="term '+(selected===t.ID?'active':'')+'" data-id="'+esc(t.ID)+'"><div><b>'+esc(t['正式/標準用語'])+'</b><small>'+esc(t['日本語推奨表記']||'')+'</small></div><div class="badges"><span class="badge blue">'+esc(t['OF/DF']||'')+'</span>'+(String(t['FIBA掲載有無']).startsWith('○')?'<span class="badge green">FIBA</span>':'')+'<span class="badge">'+esc(t['標準度']||'')+'</span></div></div>').join('');document.querySelectorAll('.term').forEach(e=>e.onclick=()=>show(e.dataset.id))}function toggleFav(id){const f=favs();f.has(id)?f.delete(id):f.add(id);localStorage.setItem('zot_favs',JSON.stringify([...f]));show(id);renderList()}function show(id){const t=DATA.find(x=>x.ID===id);if(!t)return;selected=id;const isFav=favs().has(id);$('#detail').innerHTML='<button class="mobile-back" onclick="back()">← 用語一覧</button><div class="card"><button class="fav '+(isFav?'on':'')+'" onclick="toggleFav(\''+esc(id)+'\')">★</button><div class="eyebrow">'+esc(t['カテゴリー'])+' · '+esc(t.ID)+'</div><h2 class="title">'+esc(t['正式/標準用語'])+'</h2><div class="jp">'+esc(t['日本語推奨表記']||'')+'</div><div class="meta"><span class="badge blue">'+esc(t['OF/DF']||'共通')+'</span><span class="badge '+(String(t['FIBA掲載有無']).startsWith('○')?'green':'')+'">'+esc(t['FIBA掲載有無']||'')+'</span><span class="badge">STANDARD '+esc(t['標準度']||'-')+'</span></div><div class="section"><h3>DEFINITION</h3><div class="definition">'+esc(t['定義']||'')+'</div></div><div class="section"><h3>ACTION</h3><div class="action">'+esc(t['Action図']||'—')+'</div></div><div class="section"><h3>WORLD USAGE</h3><div>'+esc(t['NBA/欧州での使用例']||'—')+'</div></div>'+(t['主要出典URL']?'<div class="section source"><h3>SOURCE</h3><a href="'+esc(t['主要出典URL'])+'" target="_blank">'+esc(t['主要出典URL'])+'</a></div>':'')+'</div>';$('#app').classList.add('show-detail');renderList()}function back(){$('#app').classList.remove('show-detail')}$('#q').addEventListener('input',renderList);document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');filter=b.dataset.f;renderList()});fetch('terms.json').then(r=>r.json()).then(d=>{DATA=d;$('#total').textContent=d.length;renderList()}).catch(()=>{$('#terms').innerHTML='<div class="listhead">terms.json を読み込めませんでした。</div>'});
</script></body></html>
